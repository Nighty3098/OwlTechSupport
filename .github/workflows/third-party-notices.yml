name: Update Third-Party Notices

on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-notices-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-notices-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses

      - name: Generate THIRD_PARTY_NOTICES.md
        run: |
          pip-licenses \
            --with-authors \
            --with-urls \
            --format=markdown \
            > THIRD_PARTY_NOTICES.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md
          git diff --cached --quiet || git commit -m "docs: update THIRD_PARTY_NOTICES [skip ci]"
          git push
